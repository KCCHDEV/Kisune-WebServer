name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type check · XSS scan · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check + XSS scan
        run: bun run check

      - name: Tests
        run: bun test
