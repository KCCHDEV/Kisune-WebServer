name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type check · XSS scan · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check + XSS scan
        run: bun run check

      - name: Tests
        run: bun test

      - name: Build standalone + smoke test
        run: |
          bun run build
          mkdir -p /tmp/run && cd /tmp/run
          PORT=3999 bun "$GITHUB_WORKSPACE/dist/standalone/server.js" &
          for i in $(seq 1 50); do curl -sf localhost:3999/api/hello > /dev/null && break; sleep 0.2; done
          curl -sf localhost:3999/ > /dev/null
          curl -sf localhost:3999/public/style.css > /dev/null
          curl -sf localhost:3999/vendor/htmx.js > /dev/null
          echo "standalone OK"
